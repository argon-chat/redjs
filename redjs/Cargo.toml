[package]
name = "redjs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Full-control Rust embedding layer over Bun's JavaScriptCore prebuilt (Windows). C ABI designed for zero-alloc C# (NativeAOT) codegen bindings."

# Standalone crate on purpose (own lockfile, no repo workspace): the webkit link
# requirements must not leak into other Rust crates in the monorepo.
[workspace]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Image decoding for the web shim (HTMLImageElement / createImageBitmap).
# Pure-Rust decoders only; matches the formats games actually ship.
url = "2"
getrandom = "0.3"
# TextDecoder: the reference WHATWG Encoding implementation (Firefox's);
# already in the tree transitively via symphonia, so ~free.
encoding_rs = "0.8"
# crypto.subtle.digest (RustCrypto, pure Rust).
sha1 = "0.10"
sha2 = "0.10"
zstd-sys = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# Audio: the native Web Audio implementation (webapi/audio.rs) maps the
# WebAudio node graph onto Firewheel's; symphonium (the same decoder firewheel
# uses) backs decodeAudioData. wav/flac/mp3/ogg-vorbis = the game formats.
firewheel = { version = "0.10", features = ["spatial_basic_node", "svf_node"] }
symphonium = { version = "0.7", default-features = false, features = ["resampler", "wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
# 2D physics: native Rapier for the player (webapi-adjacent host class RedPhysics2D;
# see .refactor/PHYSICS-NATIVE-DESIGN.md). simd-stable only — no rayon `parallel`
# (pays off only on huge scenes), no wasm.
rapier2d = { version = "0.34", features = ["simd-stable", "debug-render"] }
# 3D physics: Rapier3D alongside 2D (W-3D 3D-3, see .refactor/3D-TOOLKIT-DESIGN.md §4/§16). Same
# crate family + version as rapier2d, same host-class pattern (RedPhysics3D with zero-copy Isometry3
# pose views). simd-stable only, no rayon/wasm. The host class + engine.physics3d wiring land in
# epic 3D-3; the dep is pinned here now as part of the W-3D toolkit foundation.
rapier3d = { version = "0.34", features = ["simd-stable", "debug-render"] }
# meshopt vertex/index decode for the `.rmesh` runtime format (`RedMesh` global,
# see .refactor/RMESH-FORMAT-DESIGN.md §5) — the native counterpart of the npm
# MeshoptDecoder the editor/web player use. cc-compiles the vendored C++; the
# static-CRT match comes from .cargo/config.toml (+crt-static).
meshopt = "0.6"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
