[package]
name = "redjs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Full-control Rust embedding layer over Bun's JavaScriptCore prebuilt (Windows). C ABI designed for zero-alloc C# (NativeAOT) codegen bindings."

# Standalone crate on purpose (own lockfile, no repo workspace): the webkit link
# requirements must not leak into other Rust crates in the monorepo.
[workspace]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Image decoding for the web shim (HTMLImageElement / createImageBitmap).
# Pure-Rust decoders only; matches the formats games actually ship.
url = "2"
getrandom = "0.3"
# TextDecoder: the reference WHATWG Encoding implementation (Firefox's);
# already in the tree transitively via symphonia, so ~free.
encoding_rs = "0.8"
# crypto.subtle.digest (RustCrypto, pure Rust).
sha1 = "0.10"
sha2 = "0.10"
zstd-sys = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# SVG images (`new Image().src = "data:image/svg+xml,..."`, an SVG Blob):
# rasterized with resvg at their intrinsic size. The version and features
# are the ones gpui builds for its own SVG rendering, so an embedder that
# has gpui (vue-native) compiles nothing new.
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"], optional = true }
# Canvas 2D (`webapi/canvas2d`): the context records a backend-neutral command
# stream in kurbo/peniko terms, and vello_cpu rasterizes it when the embedder
# installs no `CanvasHost` of its own. Single-threaded on purpose (no rayon
# pool): the canvases a page draws are small, and an embedder with a GPU
# replaces the backend anyway. vello_gpu (same vello_common, same API) is the
# GPU counterpart an embedder can install.
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline"], optional = true }
kurbo = { version = "0.13.1", default-features = false, features = ["std"], optional = true }
peniko = { version = "0.6.1", default-features = false, features = ["std"], optional = true }
# Audio: the native Web Audio implementation (webapi/audio.rs) maps the
# WebAudio node graph onto Firewheel's; symphonium (the same decoder firewheel
# uses) backs decodeAudioData. wav/flac/mp3/ogg-vorbis = the game formats.
# `stream_nodes` = StreamWriterNode, the producer end of `RedStreamSourceNode`
# (webapi/pcm.rs) — how a native decoder pushes PCM into a running graph.
firewheel = { version = "0.10", features = [
    "spatial_basic_node",
    "svf_node",
    "stream_nodes",
], optional = true }
symphonium = { version = "0.7", default-features = false, features = ["resampler", "wav", "pcm", "flac", "mp3", "ogg", "vorbis"], optional = true }
# 2D physics: native Rapier for the player (webapi-adjacent host class RedPhysics2D;
# see .refactor/PHYSICS-NATIVE-DESIGN.md). simd-stable only — no rayon `parallel`
# (pays off only on huge scenes), no wasm.
rapier2d = { version = "0.34", features = ["simd-stable", "debug-render"], optional = true }
# 3D physics: Rapier3D alongside 2D (W-3D 3D-3, see .refactor/3D-TOOLKIT-DESIGN.md §4/§16). Same
# crate family + version as rapier2d, same host-class pattern (RedPhysics3D with zero-copy Isometry3
# pose views). simd-stable only, no rayon/wasm. The host class + engine.physics3d wiring land in
# epic 3D-3; the dep is pinned here now as part of the W-3D toolkit foundation.
rapier3d = { version = "0.34", features = ["simd-stable", "debug-render"], optional = true }
# meshopt vertex/index decode for the `.rmesh` runtime format (`RedMesh` global,
# see .refactor/RMESH-FORMAT-DESIGN.md §5) — the native counterpart of the npm
# MeshoptDecoder the editor/web player use. cc-compiles the vendored C++; the
# static-CRT match comes from .cargo/config.toml (+crt-static).
meshopt = { version = "0.6", optional = true }
# gzip / zlib / raw-deflate for CompressionStream and DecompressionStream
# (webapi/compression.rs). `rust_backend` = miniz_oxide: pure Rust, no C toolchain,
# no zlib link, and it is the dependency that lets those two classes be a REAL
# codec instead of a passthrough that returns its input.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# TLS for `fetch` (webapi/http.rs). PLATFORM TLS on purpose: on Windows this is
# the `schannel` crate — a thin safe wrapper over the OS SChannel API, pure Rust,
# no C toolchain, and — the part that matters for a shipped player — NO BUNDLED
# ROOT STORE. Trust follows Windows Update instead of our release cadence, and
# the binary does not carry ~250 KB of baked CA certificates. The alternative
# (rustls + ring/aws-lc-rs + webpki-roots) compiles C/asm, fights `+crt-static`,
# and pins the trust anchors to whatever we last shipped.
# Without `net-h2` the HTTP/1.1 framing is ours (webapi/http.rs); with it,
# hyper's, over a pool that is ours (webapi/http/pool.rs).
native-tls = "0.2"
# The pooled transport behind `net-h2` (see [features]). Default features off
# everywhere: the runtime is current-thread, and nothing here wants a proxy,
# a legacy pooled client, or a server.
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "time", "sync", "macros"], optional = true }
hyper = { version = "1.6", default-features = false, features = ["client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.16", default-features = false, features = ["tokio"], optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# Only to read hyper's HTTP/2 errors (GOAWAY / REFUSED_STREAM decide retries).
h2 = { version = "0.4", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
# CSS front end (W-UI UI-29) — the `RedCss` host class. Path-dep, not a registry crate: the SAME
# source compiles to wasm for the editor and the web player, so a stylesheet cannot parse one way
# in the browser and another in the shipped game (`packages/redcss`, `.refactor/UI-CSS-ENGINE-DESIGN.md`).
redcss = { path = "../../redcss", optional = true }

[target.'cfg(unix)'.dependencies]
# poll(2) for the blocking transport's readiness waits (webapi/http/sock.rs).
libc = "0.2"

[dev-dependencies]
# Loopback TLS test servers that answer ALPN (webapi/http/pool/tests.rs).
native-tls = { version = "0.2", features = ["alpn-accept"] }

# Game-engine host classes are default-on (the PEWPEW player wants all of them) and
# individually opt-out for other embedders (vue-native runs with none of these).
# NOTE for non-PEWPEW consumers: cargo resolves the MANIFEST of every optional path
# dep regardless of features, so `../../redcss` must exist on disk even with
# `css-host` off — a stub crate at that path satisfies it.
[features]
default = ["audio", "physics", "mesh", "css-host", "yoga-host", "indexeddb", "svg-images", "canvas"]
# Web Audio (AudioContext & co) + navigator.mediaDevices over the Firewheel graph.
audio = ["dep:firewheel", "dep:symphonium"]
# decodeAudioData beyond the game formats: AAC-LC + the MP4/M4A, CAF, MKV and
# AIFF containers, ALAC and ADPCM. OFF by default because it is ~10 extra
# symphonia crates that a game shipping its own .ogg/.wav assets never touches;
# ON for an app runtime, where "whatever the user's file is" is the actual
# input. Purely additive — with this off, `decodeAudioData` behaves exactly as
# it did before the flag existed, and it names the formats it does have when it
# rejects (webapi/audio.rs `decode_bytes`).
#
# NOT covered even with this on: HE-AAC/AAC+ (symphonia decodes the AAC-LC core
# and ignores SBR/PS, so a 32 kbit/s HE-AAC stream decodes dull and half-rate),
# Opus, and anything DRM'd.
audio-codecs-extra = [
    "audio",
    "symphonium?/aac",
    "symphonium?/isomp4",
    "symphonium?/alac",
    "symphonium?/adpcm",
    "symphonium?/aiff",
    "symphonium?/caf",
    "symphonium?/mkv",
]
# RedPhysics2D / RedPhysics3D host classes (Rapier).
physics = ["dep:rapier2d", "dep:rapier3d"]
# RedMesh (.rmesh meshopt decode).
mesh = ["dep:meshopt"]
# RedCss host class over the in-house redcss parser.
css-host = ["dep:redcss"]
# RedYoga host class over the vendored Yoga C++ (build.rs skips the yoga
# compile — and the vendored-sources requirement — when this is off).
yoga-host = []
# SVG decoding for Image / createImageBitmap (webapi/image.rs).
svg-images = ["dep:resvg"]
# CanvasRenderingContext2D + a real OffscreenCanvas (webapi/canvas2d). Off,
# bootstrap.js keeps its pixel-copy OffscreenCanvas stub.
canvas = ["dep:vello_cpu", "dep:kurbo", "dep:peniko"]

# ---------------------------------------------------------------------------
# Web platform surfaces that need something only the EMBEDDER has.
#
# Both are OFF by default, and that is not a judgement about how useful they
# are — it is the only setting that keeps this crate's default build byte-for-
# byte what it was before they existed. Turning a global ON by default changes
# what `typeof localStorage` answers in every consumer, including a game that
# ships its own storage layer and feature-detects around ours. An embedder that
# wants them says so; vue-native does, in crates/vn-runtime/Cargo.toml.
#
# Neither pulls a single new dependency: both are pure JSC wiring plus a trait
# the embedder implements.

# `localStorage` / `sessionStorage` / `Storage` / `StorageEvent`, over
# `webapi::storage::StorageHost`. Without a host installed the API is present
# and in-memory-only, and says so once — see that module's header.
storages = []
# `navigator.clipboard` (+ the inert `document.execCommand`), over
# `webapi::clipboard::ClipboardHost`. An embedder that already owns the OS
# clipboard for its own text fields implements the trait over that same handle
# rather than opening a second one.
clipboard = []

# IndexedDB 3.0: `indexedDB`, every `IDB*` interface, `DOMStringList`,
# `IDBVersionChangeEvent`, `navigator.storage` — over a process-wide server
# thread and the in-memory backend (persistence is the SQLite backend, later).
# ON by default, unlike the two above: it needs nothing from the embedder to be
# truthful (an app that installs no host gets a working, memory-only database
# and one advisory saying so), and every consumer of this crate is ours. No new
# dependency; one OS thread, spawned at the first `open`, never at install.
indexeddb = []
# IndexedDB ON DISK: the SQLite3 Multiple Ciphers backend (one C TU compiled
# by build.rs from the amalgamation pinned in ../pins.txt, size-optimised and
# trimmed to ChaCha20-Poly1305; no sqlite3_* symbol leaves it). Still no
# Rust dependency. Used only when an `IndexedDbHost` is installed (or a test
# asks for it); without a host the memory backend runs, as with `indexeddb`
# alone. OFF by default: it is a C compile and ~0.8 MB of code that a
# consumer with no host to give it a folder would carry for nothing.
indexeddb-sqlite = ["indexeddb"]

# `fetch`'s POOLED transport (webapi/http/pool.rs): HTTP/2 over TLS through
# ALPN, HTTP/1.1 keep-alive otherwise, per-origin pooling with a browser's
# rules (one h2 connection per origin, six HTTP/1.1, Chromium's retry rule),
# PING keepalive, RST_STREAM on abort. hyper 1.x's per-connection client
# (+ h2) over tokio-native-tls — platform TLS still, now with ALPN — on ONE
# dedicated runtime thread that redjs owns. Without it, `fetch` keeps the
# blocking transport: a thread and a fresh HTTP/1.1 connection per request.
# OFF by default because it brings an async runtime into the link (~35
# crates); vue-native turns it on (its own link already has tokio/hyper/h2 at
# the same versions). The module header of webapi/http.rs has the reasoning.
net-h2 = [
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:h2",
    "dep:tokio-native-tls",
    "native-tls/alpn",
]

# WPT IndexedDB runner (tests/wpt/README.md): its own `main`, one child
# process per test file.
[[test]]
name = "wpt_idb"
harness = false
required-features = ["indexeddb"]

# Dexie / idb / idb-keyval / localForage, vendored unmodified in tests/libs/.
[[test]]
name = "idb_libs"
required-features = ["indexeddb"]

# A process killed mid-transaction leaves the SQLite database at its last
# committed state (it spawns itself as the child it kills).
[[test]]
name = "idb_crash"
required-features = ["indexeddb-sqlite"]

# Examples that cannot compile without their host-class feature.
[[example]]
name = "yoga_conformance"
required-features = ["yoga-host"]

[[example]]
name = "audio"
required-features = ["audio"]

[[example]]
name = "analyser"
required-features = ["audio"]

[[example]]
name = "spatial"
required-features = ["audio"]

[[example]]
name = "spatial_tour"
required-features = ["audio"]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
